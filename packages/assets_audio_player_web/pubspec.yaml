name: assets_audio_player_web
description: Web plugin for assets_audio_player without broken android support.
version: 3.1.1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: AssetsAudioPlayerWebPlugin
        fileName: web/assets_audio_player_web.dart
