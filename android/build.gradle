buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven {
            url  "https://phonepe.mycloudrepo.io/public/repositories/phonepe-intentsdk-android"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 36
                if (namespace == null) {
                    def pluginNamespaces = [
                        'audio_session': 'com.ryanheise.audio_session',
                        'fluttertoast': 'io.github.ponnamkarthik.toast.fluttertoast',
                        'assets_audio_player': 'com.github.florent37.assets_audio_player'
                    ]
                    if (pluginNamespaces.containsKey(project.name)) {
                        namespace pluginNamespaces[project.name]
                    } else {
                        def manifestFile = project.file('src/main/AndroidManifest.xml')
                        if (manifestFile.exists()) {
                            try {
                                def parsedManifest = new XmlParser().parse(manifestFile)
                                def packageName = parsedManifest.'@package'
                                if (packageName != null) {
                                    namespace packageName
                                } else {
                                    namespace project.group
                                }
                            } catch (Exception e) {
                                namespace project.group
                            }
                        } else {
                            namespace project.group
                        }
                    }
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = "17"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
